name: "Age of Agents Run"
description: "Run the aoa orchestrator as a GitHub Action"
# One reconcile pass, safe to re-run. To keep a repo converging on a cadence,
# drive this from a scheduled workflow — and add a `concurrency:` group so two
# runs never race the same Event Log:
#
#   on:
#     schedule:
#       - cron: "*/30 * * * *"
#   concurrency:
#     group: aoa-${{ github.ref }}
#     cancel-in-progress: false
#
# See docs/scheduling.md for cron, systemd and webhook recipes.
inputs:
  path:
    description: "Workspace path"
    required: false
    default: "."
  goal:
    description: "Goal to submit (optional)"
    required: false
    default: ""
  otel:
    description: "Enable OpenTelemetry export"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # Read the toolchain from go.mod rather than pinning: this action used to
    # hardcode 1.22 while the module required a newer Go, so `go install` below
    # failed outright and the published action could not install the tool.
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod

    # NOTE: while the repository is private this needs a token with read access
    # in GOPRIVATE/netrc; it works unauthenticated only once the repo is public.
    - name: Install aoa
      shell: bash
      run: go install github.com/bharadwaj6/ageOfAgents/cmd/aoa@latest

    # Inputs reach the shell through the environment, never through `${{ }}`
    # interpolation into the script body — a goal containing shell syntax would
    # otherwise be executed rather than submitted.
    - name: Submit Goal
      if: ${{ inputs.goal != '' }}
      shell: bash
      env:
        AOA_PATH: ${{ inputs.path }}
        AOA_GOAL: ${{ inputs.goal }}
      run: aoa goal --path "$AOA_PATH" "$AOA_GOAL"

    - name: Run Orchestrator
      shell: bash
      env:
        AOA_PATH: ${{ inputs.path }}
        AOA_OTEL: ${{ inputs.otel }}
      run: |
        if [ "$AOA_OTEL" = "true" ]; then
          aoa run --path "$AOA_PATH" --otel-live
        else
          aoa run --path "$AOA_PATH"
        fi
