<svg xmlns="http://www.w3.org/2000/svg" width="540" height="120" viewBox="0 0 540 120" role="img" aria-labelledby="t">
  <title id="t">Age of Agents</title>
  <!-- the score: one stave every agent reads and writes -->
  <g stroke="#374151" stroke-width="2">
    <path d="M4 38 H88 M4 52 H88 M4 66 H88 M4 80 H88 M4 94 H88"/>
  </g>
  <!-- the players: a rising run of beamed notes -->
  <g fill="#818cf8">
    <ellipse cx="20" cy="87" rx="8.5" ry="6" transform="rotate(-20 20 87)"/>
    <ellipse cx="44" cy="73" rx="8.5" ry="6" transform="rotate(-20 44 73)"/>
    <ellipse cx="68" cy="59" rx="8.5" ry="6" transform="rotate(-20 68 59)"/>
  </g>
  <g stroke="#818cf8" stroke-width="3" stroke-linecap="round">
    <path d="M27.5 85 V44 M51.5 71 V30 M75.5 57 V16"/>
  </g>
  <path d="M26 44 L77 16 L77 24 L26 52 Z" fill="#818cf8"/>
  <!-- the conductor's baton -->
  <g stroke="#f3f4f6" stroke-linecap="round">
    <path d="M96 108 L126 14" stroke-width="3"/>
    <path d="M96 108 L100.5 94" stroke-width="7"/>
  </g>
  <text x="140" y="68" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">Age of Agents</text>
  <text x="142" y="98" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">aoa · an orchestra of coding agents</text>
</svg>
