<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-labelledby="t">
  <title id="t">Age of Agents</title>
  <g fill="none" stroke-linecap="round" stroke-width="6">
    <!-- three agents, each in its own lane -->
    <path d="M12 28 C 44 28, 44 60, 70 60" stroke="#818cf8"/>
    <path d="M12 60 H70" stroke="#818cf8"/>
    <path d="M12 92 H50" stroke="#818cf8"/>
    <!-- the one that failed the Gate stops short of it -->
    <path d="M56 84 L68 96 M68 84 L56 96" stroke="#f87171" stroke-width="5"/>
    <!-- main, still green -->
    <path d="M84 60 H104" stroke="#4ade80"/>
  </g>
  <g fill="#818cf8"><circle cx="12" cy="28" r="6"/><circle cx="12" cy="60" r="6"/><circle cx="12" cy="92" r="6"/></g>
  <!-- the Gate -->
  <rect x="72" y="14" width="10" height="92" rx="3" fill="#f3f4f6"/>
  <circle cx="108" cy="60" r="8" fill="#4ade80"/>
  <text x="140" y="68" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">Age of Agents</text>
  <text x="142" y="98" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">aoa · only what passes the Gate lands</text>
</svg>
